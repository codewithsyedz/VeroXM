# Local-dev gateway — the single entry point into the dockerized stack
# (http://localhost:8080). This is NOT the production strangler-fig config;
# that's ../../infra/nginx.conf.sample, which also routes to the legacy
# Laravel app and is what actually gets used for the real cutover. This one
# only knows about the two new-stack containers, since legacy stays on its
# current host per the local-dev setup.

# Docker's embedded DNS server. Deliberately NOT using static `upstream {
# server web:3000; }` blocks (the first version of this file did) —
# nginx resolves a name inside an upstream block once, when the config
# loads, and then caches that IP forever. `web`/`api` get a NEW container
# IP every time `docker compose restart web` (or up --build) recreates
# them, so the old setup would keep sending traffic to a dead IP and fail
# with "Connection refused" until the gateway itself was restarted too —
# exactly what happened once during this session's own dev loop. Routing
# through a variable instead forces nginx to re-resolve via this resolver
# on every request, picking up the container's current IP without needing
# a gateway restart.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    # Same path shapes the public API controllers register internally
    # (see apps/api/src/public-api and docs/PHASE-5-NOTES.md): the legacy-
    # compatible v1 shim lives under /public/v1/, mounted externally at
    # /api/ in production — reproduced here too so local testing matches.
    # NextAuth mounts its own session/signin/callback endpoints at
    # /api/auth/* inside the web app itself — this has to be matched
    # ahead of the /api/ catch-all below, or the NestJS api container
    # swallows NextAuth's own requests (nginx picks the longest matching
    # prefix regardless of block order, so this works wherever it's
    # placed, but keeping it visually above /api/ avoids the trap this
    # was actually caught by: an unrelated container silently answering
    # for a path it doesn't own).
    location /api/auth/ {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /public/v1/$1 break;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /public/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Slice 1 (docs/IDENTITY-PLATFORM-RECOMMENDATION.md §7): the one
    # test-only route, GET /auth/keycloak-whoami, lives directly on the
    # NestJS api (not under /public/v1/ like the rest of the public API).
    # Without this block it falls through to the `location /` catch-all
    # below and hits the Next.js web container instead, which 404s.
    location /auth/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # docs/RBAC-TENANT-RECOMMENDATION.md §5.2/§8 step 2: the proof-of-concept
    # GET /permissions/my-permissions/:projectId route, same situation as
    # /auth/ above — it lives directly on the NestJS api, not under
    # /public/v1/, so it needs its own block or it 404s against Next.js.
    location /permissions/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # docs/RBAC-TENANT-RECOMMENDATION.md §5.5/§8 step 5 follow-up: UNLIKE
    # /permissions/ and /auth/ above, /departments is NOT given a gateway
    # block here — it collides with the Next.js dashboard page of the same
    # name (apps/web/.../departments/page.tsx), which a browser visits
    # directly through this gateway. A block here would hijack that page
    # request to the NestJS api container instead (this was tried and
    # produced exactly that: a raw 401 JSON body where the dashboard page
    # should have loaded). The Departments API routes are only ever called
    # server-to-server, from Next.js server components/actions via
    # process.env.API_URL, which points at the api container directly and
    # bypasses this gateway entirely — the same reason /projects (also a
    # frontend page AND an api-side @Controller('projects')) has no block
    # here either. Test these routes with `docker compose exec api curl
    # http://localhost:4000/departments/...` (or from inside the web
    # container), not through http://localhost:8080.

    # docs/RBAC-TENANT-RECOMMENDATION.md §11.10: same reasoning as
    # /departments just above -- /tenants is ALSO both a Next.js dashboard
    # page (apps/web/.../tenants/page.tsx) and an api-side
    # @Controller('tenants'), so it deliberately gets no gateway block
    # here either. Test these routes the same way: `docker compose exec
    # api curl http://localhost:4000/tenants/...`, not through
    # http://localhost:8080.

    # Everything else: the admin dashboard, the marketing site, NextAuth's
    # own routes, and Next's dev-mode HMR websocket — all served by Next.js.
    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
